# Compila el APK de Android con GameCI y lo deja como artefacto descargable.
# Requiere los secretos UNITY_LICENSE, UNITY_EMAIL y UNITY_PASSWORD
# (ver unity/PagaParaMorir/README.md, sección "Compilar el APK de Android").
name: APK de Android

on:
  workflow_dispatch:
  push:
    paths:
      - "unity/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Revisar la licencia de Unity
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Faltan los secretos UNITY_LICENSE, UNITY_EMAIL y UNITY_PASSWORD. Ver unity/PagaParaMorir/README.md, sección 'Compilar el APK de Android'."
            exit 1
          fi

      # La imagen de Unity para Android ocupa ~10 GB: liberar espacio del runner.
      - name: Liberar espacio en disco
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          tool-cache: false

      - uses: actions/checkout@v4

      - name: Caché de Library
        uses: actions/cache@v4
        with:
          path: unity/PagaParaMorir/Library
          key: Library-Android-${{ hashFiles('unity/PagaParaMorir/Assets/**', 'unity/PagaParaMorir/Packages/**') }}
          restore-keys: Library-Android-

      - name: Compilar con Unity
        uses: game-ci/unity-builder@v4
        with:
          projectPath: unity/PagaParaMorir
          unityVersion: 6000.0.84f1
          targetPlatform: Android
          buildName: PagaParaMorir
          buildMethod: PagaParaMorir.Game.Editor.BuildScript.BuildAndroidFromCommandLine
          androidExportType: androidPackage
          versioning: None
          # Opcional: firma de release (sin esto se firma con la llave de depuración).
          androidKeystoreName: release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: PagaParaMorir-apk
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 14
